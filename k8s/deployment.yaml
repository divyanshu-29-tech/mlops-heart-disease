apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-heart-disease
  labels:
    app: mlops-heart-disease
spec:
  replicas: 2

  selector:
    matchLabels:
      app: mlops-heart-disease

  template:
    metadata:
      labels:
        app: mlops-heart-disease

    spec:
      containers:
        - name: mlops-heart-disease
          image: mlops-heart-disease:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
